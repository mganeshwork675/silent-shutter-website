
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silent Shutter | Creative Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #101114;
      color: white;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: clamp(40px, 8vw, 80px);
      letter-spacing: 5px;
    }

    h1 span {
      color: #398cff;
    }

    p {
      margin-top: 25px;
      color: #aaa;
      letter-spacing: 3px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>SILENT <span>SHUTTER</span></h1>
    <p>WE CREATE. WE COMMUNICATE. WE CAPTURE.</p>
  </main>
</body>
</html>
